[package]
name = "topdog-gui"
description = "The topdog desktop application: table browser and (soon) interactive plotting"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "topdog"
path = "src/main.rs"

[dependencies]
topdog-core = { workspace = true }
topdog-io = { workspace = true }
topdog-plot = { workspace = true }
iced = { workspace = true }
rfd = { workspace = true }
anyhow = { workspace = true }
# PNG export: rasterizes the SVG produced by the shared Surface renderer,
# so raster output cannot drift from screen/vector output.
resvg = "0.45"

[dev-dependencies]
# Building in-memory DataTables for tests of the Python generator.
polars = { workspace = true }
